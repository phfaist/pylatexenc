name: 'tests-ci'

on:
  push:
    branches: [ "main", "devel" ]
  pull_request:
    branches: [ "main", "devel" ]
#  schedule:
#    - cron: "13 20 * * 3"

jobs:
  tests-ci:

    strategy:
      #fail-fast: true
      matrix:
        # These should span the range declared by 'requires-python' in
        # pyproject.toml.  uv downloads whichever interpreter is missing from
        # the runner, so testing older pythons no longer needs an old (and by
        # now unavailable) runner image.
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        os:
          - 'ubuntu-latest'

    runs-on: '${{ matrix.os }}'

    steps:
      - uses: actions/checkout@v4

      - name: 'Set up uv'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '${{ matrix.python-version }}'

      - name: 'Run tests'
        run: uv run --frozen pytest
