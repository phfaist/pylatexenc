[project]
name = "pylatexenc"
description = "Simple LaTeX parser providing latex-to-unicode and unicode-to-latex conversion"
authors = [
    { name = "Philippe Faist", email = "philippe.faist@bluewin.ch" },
]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.rst"
requires-python = ">=3.6"
keywords = ["latex", "text", "unicode", "encode", "parse", "expression"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

# The version string is single-sourced from pylatexenc/version.py; see
# [tool.hatch.version] below.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/phfaist/pylatexenc"
Documentation = "https://pylatexenc.readthedocs.io/"
Repository = "https://github.com/phfaist/pylatexenc"
Issues = "https://github.com/phfaist/pylatexenc/issues"

[project.scripts]
latexwalker = 'pylatexenc.latexwalker.__main__:main'
latex2text = 'pylatexenc.latex2text.__main__:main'
latexencode = 'pylatexenc.latexencode.__main__:main'


# Development dependency groups (PEP 735).  Install with e.g.
#
#     uv sync                        # the "dev" group, installed by default
#     uv sync --group builddoc       # additionally, the doc build requirements
#
[dependency-groups]
dev = [
    "pytest>=7.0",
]
builddoc = [
    "Sphinx>=5.0.0",
    "sphinx-issues>=3.0.0",
]
buildjslib = [
    "Transcrypt==3.9.3",
    "PyYAML>=5.0",
]

# The development tooling does not have to run on every python version that the
# library itself supports.  Restricting the groups to python 3.10 and later lets
# uv lock current releases of pytest, Sphinx and their dependencies.  Without
# this restriction the resolution has to accommodate python 3.6 (the
# 'requires-python' value above), and uv then locks one set of packages per
# python version, down to long-unmaintained releases for the oldest ones.
#
# This only concerns the development environment described by 'uv.lock'; the
# library itself keeps advertising python 3.6 and has no runtime dependencies at
# all.  The test suite still runs on older pythons, with pytest resolved outside
# of the lock file; see '.github/workflows/tests-ci.yml'.
[tool.uv.dependency-groups]
dev = { requires-python = ">=3.10" }
builddoc = { requires-python = ">=3.10" }
buildjslib = { requires-python = ">=3.10" }

[tool.uv]
# Only "dev" is installed by a plain `uv sync`; "builddoc" and "buildjslib" are
# opt-in via `--group`.
default-groups = ["dev"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pylatexenc/version.py"
# anchored at the start of a line, so that the example version string appearing
# in the release-checklist comment of version.py is not picked up by mistake
pattern = '''^version_str\s*=\s*["'](?P<version>[^"']+)["']'''

[tool.hatch.build.targets.wheel]
packages = ["pylatexenc"]

[tool.hatch.build.targets.sdist]
include = [
    "/pylatexenc",
    "/README.rst",
]


[tool.pytest.ini_options]
testpaths = [
    "test",
]
